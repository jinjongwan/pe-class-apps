<body>
<div id="app"></div>
<script>
let S={isTeacher:false,tab:'players',players:[],tournament:null,histories:[],playerStats:{},
  _newName:'',_newHc:0,_showBulk:false,_bulkInput:'',_numTeams:10,_hasUnsaved:false,_lastSaved:null};

const HC=[-3,-2,-1,0,1,2,3];
const SK='bmt-v3-';
function save(){try{localStorage.setItem(SK+'d',JSON.stringify({players:S.players,tournament:S.tournament,histories:S.histories,playerStats:S.playerStats}))}catch(e){}S._hasUnsaved=true}
function load(){try{const d=JSON.parse(localStorage.getItem(SK+'d'));if(d){S.players=d.players||[];S.tournament=d.tournament||null;S.histories=d.histories||[];S.playerStats=d.playerStats||{}}}catch(e){}}
function gid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function E(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ht(v){return v>0?'+'+v:v===0?'±0':''+v}
function hcl(v){return v===0?'bdg-g':v>0?'bdg-r':'bdg-b'}

// Team handicap: 2명=합산, 3명이상=평균 반올림
function thc(t){
  const pl=t.players||[];if(!pl.length)return 0;
  const sum=pl.reduce((s,p)=>s+(p.handicap||0),0);
  return pl.length<=2?sum:Math.round(sum/pl.length);
}

function calcStart(tA,tB){
  const diff=thc(tA)-thc(tB);if(diff===0)return{a:0,b:0};
  const abs=Math.abs(diff);
  // +핸디캡=약한 선수(점수 받음), -핸디캡=강한 선수(점수 줌)
  // diff>0이면 A가 약한 팀 → A가 시작점수를 받음
  if(diff>0)return{a:Math.min(abs,5),b:abs>5?-(abs-5):0};
  return{a:abs>5?-(abs-5):0,b:Math.min(abs,5)};
}

function genRR(teams){
  const t=[...teams];if(t.length%2!==0)t.push(null);
  const n=t.length,rounds=[];
  for(let r=0;r<n-1;r++){
    const matches=[];let bye=null;
    for(let i=0;i<n/2;i++){const h=t[i],a=t[n-1-i];if(!h)bye=a?.id;else if(!a)bye=h?.id;
    else matches.push({id:gid(),teamA:h.id,teamB:a.id,scoreA:'',scoreB:'',court:0,league:'',refs:[]})}
    rounds.push({round:r+1,matches,bye});
    const last=t.pop();t.splice(1,0,last);
  }
  return rounds;
}

// Referee assignment for round-robin
function assignRefs(schedule,teams){
  schedule.forEach(rd=>{
    // Collect bye team players for each league
    const refPoolA=[],refPoolB=[];
    if(rd.bye.A){const bt=teams.find(t=>t.id===rd.bye.A);if(bt)refPoolA.push(...bt.players.map(p=>p.name))}
    if(rd.bye.B){const bt=teams.find(t=>t.id===rd.bye.B);if(bt)refPoolB.push(...bt.players.map(p=>p.name))}
    // Assign: A league refs → A league matches, B league refs → B league matches
    const mA=rd.matches.filter(m=>m.league==='A');
    const mB=rd.matches.filter(m=>m.league==='B');
    let riA=0,riB=0;
    mA.forEach(m=>{m.refs=[];while(m.refs.length<1&&riA<refPoolA.length)m.refs.push(refPoolA[riA++])});
    mB.forEach(m=>{m.refs=[];while(m.refs.length<1&&riB<refPoolB.length)m.refs.push(refPoolB[riB++])});
    // Distribute remaining refs evenly
    const leftA=refPoolA.slice(riA),leftB=refPoolB.slice(riB);
    const allLeft=[...leftA,...leftB];
    let li=0;
    rd.matches.forEach(m=>{if(li<allLeft.length){m.refs.push(allLeft[li++])}});
  });
}

// Referee assignment for playoffs
function assignPORefs(playoffs,teams){
  const playingIds=new Set();
  playoffs.filter(m=>!m.bye).forEach(m=>{playingIds.add(m.teamA);playingIds.add(m.teamB)});
  const refPool=[];
  teams.forEach(t=>{if(!playingIds.has(t.id))refPool.push(...t.players.map(p=>p.name))});
  // Also add bye team players
  playoffs.filter(m=>m.bye).forEach(m=>{const t=teams.find(x=>x.id===m.teamA);if(t)refPool.push(...t.players.map(p=>p.name))});
  let ri=0;
  playoffs.filter(m=>!m.bye).forEach(m=>{m.refs=[];while(m.refs.length<1&&ri<refPool.length)m.refs.push(refPool[ri++])});
  // Spread rest
  playoffs.filter(m=>!m.bye).forEach(m=>{if(ri<refPool.length)m.refs.push(refPool[ri++])});
}

function generateTeams(){
  const avail=S.players.filter(p=>!p.absent);const nt=S._numTeams;
  if(avail.length<nt*2){alert(`최소 ${nt*2}명 필요 (현재 ${avail.length}명)`);return}
  if(nt<4||nt>20){alert('팀 수는 4~20');return}
  const shuffled=shuffle(avail);
  const base=Math.floor(shuffled.length/nt),extra=shuffled.length%nt;
  const teams=[];let idx=0;
  for(let i=0;i<nt;i++){const sz=i<extra?base+1:base;
    teams.push({id:gid(),num:i+1,name:`팀${i+1}`,players:shuffled.slice(idx,idx+sz).map(p=>({...p})),league:null});idx+=sz}
  const si=shuffle([...Array(nt).keys()]);
  const nA=Math.ceil(nt/2),nB=nt-nA;
  si.slice(0,nA).forEach(i=>teams[i].league='A');si.slice(nA).forEach(i=>teams[i].league='B');
  const lA=teams.filter(t=>t.league==='A').sort((a,b)=>a.num-b.num);
  const lB=teams.filter(t=>t.league==='B').sort((a,b)=>a.num-b.num);
  const rrA=genRR(lA),rrB=genRR(lB);
  const maxR=Math.max(rrA.length,rrB.length);const schedule=[];
  for(let r=0;r<maxR;r++){
    const matches=[];let court=1;
    const rA=rrA[r],rB=rrB[r];
    if(rA)rA.matches.forEach(m=>{m.court=court++;m.league='A';matches.push(m)});
    if(rB)rB.matches.forEach(m=>{m.court=court++;m.league='B';matches.push(m)});
    schedule.push({round:r+1,matches,bye:{A:rA?.bye||null,B:rB?.bye||null}});
  }
  assignRefs(schedule,teams);
  S.tournament={teams,leagueA:lA.map(t=>t.id),leagueB:lB.map(t=>t.id),
    nA,nB,schedule,playoffs:null,phase:'roundRobin',date:new Date().toLocaleString('ko-KR'),numPlayoffs:Math.min(nA,nB)};
  S.tab='tournament';save();R();
}

function calcStandings(ids){
  const T=S.tournament;if(!T)return[];
  const st={};ids.forEach(id=>{const tm=T.teams.find(t=>t.id===id);st[id]={id,name:tm?.name||'?',w:0,l:0,pf:0,pa:0}});
  T.schedule.forEach(r=>{r.matches.forEach(m=>{
    const a=parseInt(m.scoreA),b=parseInt(m.scoreB);if(isNaN(a)||isNaN(b)||(!a&&!b))return;
    if(st[m.teamA]){st[m.teamA].pf+=a;st[m.teamA].pa+=b;if(a>b)st[m.teamA].w++;else if(b>a)st[m.teamA].l++}
    if(st[m.teamB]){st[m.teamB].pf+=b;st[m.teamB].pa+=a;if(b>a)st[m.teamB].w++;else if(a>b)st[m.teamB].l++}
  })});
  return Object.values(st).sort((a,b)=>{if(b.w!==a.w)return b.w-a.w;const da=a.pf-a.pa,db=b.pf-b.pa;if(db!==da)return db-da;return b.pf-a.pf});
}
function allRRDone(){return S.tournament?.schedule.every(r=>r.matches.every(m=>m.scoreA!==''&&m.scoreB!==''))}

function generatePlayoffs(){
  const T=S.tournament,stA=calcStandings(T.leagueA),stB=calcStandings(T.leagueB);
  const np=T.numPlayoffs,po=[];
  for(let i=0;i<np;i++){po.push({id:gid(),rank:i+1,teamA:stA[i].id,teamB:stB[i].id,scoreA:'',scoreB:'',refs:[],
    label:`${i*2+1},${i*2+2}위 결정전`,finalA:i*2+1,finalB:i*2+2})}
  if(T.nA>T.nB){for(let i=T.nB;i<T.nA;i++){
    po.push({id:gid(),rank:i+1,teamA:stA[i].id,teamB:null,scoreA:'BYE',scoreB:'',refs:[],
      label:`${i*2+1}위 (자동 배정)`,finalA:i*2+1,finalB:null,bye:true})}}
  assignPORefs(po,T.teams);
  T.playoffs=po;T.phase='playoffs';save();R();
}
function allPODone(){return S.tournament?.playoffs?.filter(m=>!m.bye).every(m=>m.scoreA!==''&&m.scoreB!=='')}

function getFinalRanks(){
  const po=S.tournament?.playoffs;if(!po)return[];
  const ranks=[];
  po.forEach(m=>{
    if(m.bye){ranks.push({rank:m.finalA,team:m.teamA});return}
    const sa=parseInt(m.scoreA)||0,sb=parseInt(m.scoreB)||0;
    if(sa>=sb){ranks.push({rank:m.finalA,team:m.teamA});ranks.push({rank:m.finalB,team:m.teamB})}
    else{ranks.push({rank:m.finalA,team:m.teamB});ranks.push({rank:m.finalB,team:m.teamA})}
  });
  return ranks.sort((a,b)=>a.rank-b.rank);
}

// Individual point calculation
function calcPoints(rank,totalPositions){return Math.max(1,totalPositions-rank+1)}

function finishTournament(){
  const T=S.tournament;T.phase='finished';
  const ranks=getFinalRanks();const totalPos=ranks.length;
  // Update player stats
  ranks.forEach(r=>{
    const tm=T.teams.find(t=>t.id===r.team);if(!tm)return;
    const pts=calcPoints(r.rank,totalPos);
    tm.players.forEach(p=>{
      if(!S.playerStats[p.id])S.playerStats[p.id]={name:p.name,total:0,weeks:[]};
      S.playerStats[p.id].name=p.name;
      S.playerStats[p.id].total+=pts;
      S.playerStats[p.id].weeks.push({date:T.date,team:tm.name,rank:r.rank,pts});
    });
  });
  S.histories.unshift({...JSON.parse(JSON.stringify(T)),savedAt:new Date().toLocaleString('ko-KR')});
  save();R();
}

function getTeam(id){return S.tournament?.teams.find(t=>t.id===id)||{name:'?',players:[]}}

      <input class="f sci" value="${E(m.scoreA)}" placeholder="-" oninput="setPO(${i},'scoreA',this.value)">
      <span class="scs">:</span>
      <input class="f sci" value="${E(m.scoreB)}" placeholder="-" oninput="setPO(${i},'scoreB',this.value)">
      ${has?`<span class="bdg bdg-gn" style="margin-left:8px">${wA?E(tA.name):E(tB.name)} → ${wA?m.finalA:m.finalB}위</span>`:''}</div>
      ${m.refs?.length?`<div class="ref">🧑‍⚖️ 심판: <b>${m.refs.map(r=>E(r)).join(', ')}</b></div>`:''}
      </div></div>`;
    });
    h+=`</div>`;
    if(T){h+=`<div style="text-align:center;padding:20px 0">
    <button class="gbtn grn" onclick="if(allPODone())finishTournament();else alert('모든 결정전 스코어를 입력해주세요')">🎉 대회 종료 & 결과 확정</button></div>`}
  }

  // ═══ RESULTS ═══
  if(s.tab==='results'&&s.tournament?.phase==='finished'){
    const ranks=getFinalRanks(),totalPos=ranks.length;
    const medals=['🥇','🥈','🥉'];
    const bgs=['linear-gradient(135deg,#fef3c7,#fde68a)','linear-gradient(135deg,#f3f4f6,#e5e7eb)','linear-gradient(135deg,#fef3c7,#fed7aa)'];
    const bds=['#fbbf24','#9ca3af','#f59e0b'];
    h+=`<div class="card" style="text-align:center;padding:30px"><div style="font-size:40px;margin-bottom:8px">🏆</div>
    <h2 style="font-size:22px;font-weight:900;margin-bottom:20px">최종 순위</h2><div style="max-width:500px;margin:0 auto">`;
    ranks.forEach(r=>{const t=getTeam(r.team),pts=calcPoints(r.rank,totalPos);
      h+=`<div class="final-card" style="background:${r.rank<=3?bgs[r.rank-1]:'#f9fafb'};border:2px solid ${r.rank<=3?bds[r.rank-1]:'#e5e7eb'}">
      <span class="medal">${r.rank<=3?medals[r.rank-1]:''}</span>
      <div class="info"><div class="fn">${E(t.name)}</div><div class="fp">${t.players.map(p=>p.name).join(', ')}</div></div>
      <div style="text-align:right"><div class="fr">${r.rank}위</div><div style="font-size:12px;color:#f59e0b;font-weight:700">+${pts}점</div></div></div>`});
    h+=`</div></div>`;
    if(T)h+=`<div style="text-align:center;padding:10px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button class="exbtn" onclick="expXL()">📊 엑셀</button>
    <button class="gbtn red" style="font-size:14px;padding:10px 20px" onclick="if(confirm('새 대회 시작?')){S.tournament=null;S.tab='players';save();R()}">🔄 새 대회</button></div>`;
  }

  // ═══ INDIVIDUAL RANKING ═══
  if(s.tab==='ranking'){
    h+=`<div class="card"><h3 class="ctit">👑 개인 누적 순위</h3>
    <p style="font-size:13px;color:#6b7280;margin-bottom:14px">매주 대회 종료 시 순위별 포인트가 적립됩니다 (1위=${s.tournament?s.tournament.teams.length*2:'N*2'}점, 2위=${s.tournament?s.tournament.teams.length*2-1:'N*2-1'}점 ...)</p>`;
    const sorted=Object.values(s.playerStats).sort((a,b)=>b.total-a.total);
    if(!sorted.length)h+=`<div class="es">아직 완료된 대회가 없습니다</div>`;
    else{
      h+=`<table class="irtbl"><tr><th style="width:30px">#</th><th style="text-align:left">선수</th><th>누적 점수</th><th>대회 수</th><th>평균</th><th>최고 순위</th></tr>`;
      sorted.forEach((p,i)=>{
        const best=p.weeks.length?Math.min(...p.weeks.map(w=>w.rank)):'-';
        const avg=p.weeks.length?(p.total/p.weeks.length).toFixed(1):'-';
        const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        h+=`<tr><td style="font-weight:800;color:#f59e0b">${medal||i+1}</td>
        <td style="text-align:left;font-weight:600">${E(p.name)}</td>
        <td style="font-weight:800;font-size:16px;color:#1e40af">${p.total}</td>
        <td>${p.weeks.length}회</td><td>${avg}</td><td style="font-weight:700">${best}위</td></tr>`;
      });
      h+=`</table>`;

      // Detail toggle
      h+=`<div style="margin-top:16px"><button class="bs" style="font-size:12px" onclick="document.getElementById('rd').style.display=document.getElementById('rd').style.display==='none'?'block':'none'">📋 주차별 상세 보기</button>
      <div id="rd" style="display:none;margin-top:10px">`;
      sorted.forEach(p=>{
        h+=`<div style="margin-bottom:8px"><b>${E(p.name)}</b> (${p.total}점)<br>`;
        p.weeks.forEach(w=>{h+=`<span style="font-size:12px;color:#6b7280;margin-right:10px">${E(w.date)}: ${E(w.team)} ${w.rank}위 (+${w.pts})</span>`});
        h+=`</div>`;
      });
      h+=`</div></div>`;
    }
    h+=`</div>`;
    if(T&&Object.keys(s.playerStats).length){
      h+=`<div style="text-align:center"><button class="bsm" style="color:#ef4444" onclick="if(confirm('개인 누적 점수를 초기화하시겠습니까?')){S.playerStats={};save();R()}">🗑 개인 순위 초기화</button></div>`;
    }
  }

  // ═══ HISTORY ═══
  if(s.tab==='history'){
    h+=`<div class="card"><h3 class="ctit">📜 대회 히스토리 (${s.histories.length}건)</h3>`;
    if(!s.histories.length)h+=`<div class="es">저장된 대회 없음</div>`;
    else s.histories.forEach((hi,idx)=>{
      h+=`<div style="padding:12px;background:#f9fafb;border-radius:10px;border:1px solid #e5e7eb;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-weight:700">🏸 복식 리그 (${hi.teams?.length||0}팀)</div>
      <div style="font-size:12px;color:#6b7280">${E(hi.date)}</div></div>
      ${T?`<button class="bsm" style="color:#ef4444" onclick="S.histories.splice(${idx},1);save();R()">🗑</button>`:''}</div></div>`;
    });
    h+=`</div>`;
  }

  h+=`</div>`;
  h+=`<div class="fbar"><button class="fbtn sv" onclick="qSave()">💾 저장</button><span style="color:rgba(255,255,255,.25)">|</span>
  <label class="fbtn ld">📂 불러오기<input type="file" accept=".json" onchange="qLoad(event)" style="display:none"></label>
  ${S._lastSaved?`<div class="fst">저장: ${S._lastSaved}</div>`:'<div class="fst">💡 종료 전 파일 저장!</div>'}</div><div id="ta"></div>`;
  document.getElementById('app').innerHTML=h;
}

// ═══ Actions ═══
function TM(){S.isTeacher=!S.isTeacher;if(!S.isTeacher&&S.tab==='players')S.tab='tournament';R()}
function ST(t){S.tab=t;R()}
function toast(m){const t=document.getElementById('ta');if(t){t.innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>{if(t)t.innerHTML=''},2200)}}
function AP(){const n=S._newName.trim();if(!n)return;if(S.players.find(p=>p.name===n)){alert('중복');return}
S.players.push({id:gid(),name:n,handicap:S._newHc,absent:false});S._newName='';S._newHc=0;save();R()}
function ABP(){const ns=S._bulkInput.split(/[\n,]+/).map(n=>n.trim()).filter(Boolean);const ex=new Set(S.players.map(p=>p.name));
ns.forEach(n=>{if(!ex.has(n)){S.players.push({id:gid(),name:n,handicap:0,absent:false});ex.add(n)}});S._bulkInput='';S._showBulk=false;save();R()}
function togAbs(id){const p=S.players.find(x=>x.id===id);if(p)p.absent=!p.absent;save();R()}
function editHc(id){const p=S.players.find(x=>x.id===id);if(!p)return;const v=prompt(`${p.name} 핸디캡 (-3~+3):`,p.handicap||0);if(v!==null){p.handicap=Math.max(-3,Math.min(3,parseInt(v)||0));save();R()}}
function setSc(ri,mi,f,v){S.tournament.schedule[ri].matches[mi][f]=v;save()}
function setPO(i,f,v){S.tournament.playoffs[i][f]=v;save()}

// Excel
function expXL(){
  if(!S.tournament)return;const T=S.tournament,wb=XLSX.utils.book_new();
  const s1=[['팀편성'],['팀','리그','선수','팀핸디캡']];
  T.teams.sort((a,b)=>a.num-b.num).forEach(t=>{s1.push([t.name,t.league,t.players.map(p=>`${p.name}(${ht(p.handicap||0)})`).join(', '),thc(t)])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s1),'팀편성');
  const s2=[['리그전'],['라운드','코트','리그','팀A','팀B','시작A','시작B','최종A','최종B','승리','심판']];
  T.schedule.forEach(r=>{r.matches.forEach(m=>{const tA=getTeam(m.teamA),tB=getTeam(m.teamB),st=calcStart(tA,tB);
  const w=m.scoreA&&m.scoreB?(parseInt(m.scoreA)>parseInt(m.scoreB)?tA.name:parseInt(m.scoreB)>parseInt(m.scoreA)?tB.name:'무승부'):'-';
  s2.push([r.round,m.court,m.league,tA.name,tB.name,st.a,st.b,m.scoreA,m.scoreB,w,(m.refs||[]).join(', ')])})});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s2),'리그전');
  if(T.playoffs){const s3=[['결정전'],['경기','팀A','팀B','스코어A','스코어B','승리','순위','심판']];
  T.playoffs.filter(m=>!m.bye).forEach(m=>{const w=m.scoreA&&m.scoreB?(parseInt(m.scoreA)>parseInt(m.scoreB)?getTeam(m.teamA).name:getTeam(m.teamB).name):'-';
  s3.push([m.label,getTeam(m.teamA).name,getTeam(m.teamB).name,m.scoreA,m.scoreB,w,`${m.finalA},${m.finalB}위`,(m.refs||[]).join(', ')])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s3),'결정전')}
  // Individual
  const sorted=Object.values(S.playerStats).sort((a,b)=>b.total-a.total);
  if(sorted.length){const s4=[['개인 누적 순위'],['순위','이름','누적점수','대회수','평균','최고순위']];
  sorted.forEach((p,i)=>{const best=Math.min(...p.weeks.map(w=>w.rank));
  s4.push([i+1,p.name,p.total,p.weeks.length,(p.total/p.weeks.length).toFixed(1),best+'위'])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s4),'개인순위')}
  XLSX.writeFile(wb,`배드민턴대회_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// File
let _fh=null;
async function qSave(){save();const data={version:3,type:'bmt-league',players:S.players,tournament:S.tournament,histories:S.histories,playerStats:S.playerStats,date:new Date().toLocaleString('ko-KR')};
if(window.showSaveFilePicker&&_fh){try{const w=await _fh.createWritable();await w.write(JSON.stringify(data,null,2));await w.close();S._lastSaved=new Date().toLocaleTimeString('ko-KR');S._hasUnsaved=false;toast('✅ 저장!');R();return}catch(e){}}
if(window.showSaveFilePicker){try{_fh=await window.showSaveFilePicker({suggestedName:'배드민턴대회.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});const w=await _fh.createWritable();await w.write(JSON.stringify(data,null,2));await w.close();S._lastSaved=new Date().toLocaleTimeString('ko-KR');S._hasUnsaved=false;toast('✅ 저장!');R();return}catch(e){}}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)]));a.download='배드민턴대회.json';a.click();S._lastSaved=new Date().toLocaleTimeString('ko-KR');S._hasUnsaved=false;toast('✅ 다운로드!');R()}
function qLoad(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();
r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.type==='bmt-league'){S.players=d.players||[];S.tournament=d.tournament||null;S.histories=d.histories||[];S.playerStats=d.playerStats||{};save();R();toast('📂 불러왔습니다')}else alert('올바른 파일이 아닙니다')}catch(err){alert('읽기 실패')}};r.readAsText(file);e.target.value=''}
window.addEventListener('beforeunload',e=>{if(S._hasUnsaved){e.preventDefault();e.returnValue=''}});
load();R();
</script>
