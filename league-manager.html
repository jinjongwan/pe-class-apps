<body>
<div id="app"></div>
<script>
let S={isTeacher:false,tab:'assign',currentClass:'1반',classes:['1반','2반','3반'],classData:{},
players:[],conflicts:[],history:[],
newName:'',newHandicap:0,editingId:null,editName:'',editHandicap:0,showBulk:false,bulkInput:'',
cp1:'',cp2:'',assignment:null,assignError:'',gameRoles:{},customRoles:[],scores:{},sportType:'배드민턴',
viewHistoryIdx:null,showNewClass:false,newClassName:'',editingResultIdx:null,_hasUnsaved:false,_lastSaved:null};

const SK='league-v4-';
function save(){try{S.classData[S.currentClass]={players:S.players,conflicts:S.conflicts,history:S.history};localStorage.setItem(SK+'cls',JSON.stringify(S.classes));localStorage.setItem(SK+'cd',JSON.stringify(S.classData))}catch(e){}S._hasUnsaved=true}
function load(){try{const c=localStorage.getItem(SK+'cls'),d=localStorage.getItem(SK+'cd');if(c)S.classes=JSON.parse(c);if(d)S.classData=JSON.parse(d);if(!S.classes.length)S.classes=['1반'];swCls(S.currentClass)}catch(e){}}
function swCls(c){if(S.classData[S.currentClass])S.classData[S.currentClass]={players:S.players,conflicts:S.conflicts,history:S.history};S.currentClass=c;if(!S.classData[c])S.classData[c]={players:[],conflicts:[],history:[]};const d=S.classData[c];S.players=d.players;S.conflicts=d.conflicts;S.history=d.history;S.assignment=null;S.assignError='';S.viewHistoryIdx=null;S.editingResultIdx=null;save()}

function gid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function E(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ht(v){return v>0?'+'+v:v===0?'±0':''+v}
function hc(v){return v===0?'g':v>0?'r':'b'}
function thc(t){return t.reduce((s,p)=>s+p.handicap,0)}
function calcStart(tA,tB){
  const diff=thc(tA)-thc(tB); // positive = A stronger
  if(diff===0)return{a:0,b:0};
  const abs=Math.abs(diff);
  if(diff>0){return{a:abs>5?-(abs-5):0, b:Math.min(abs,5)}}
  else{return{a:Math.min(abs,5), b:abs>5?-(abs-5):0}}
}

function asgn(){
  const{players:P,conflicts:C}=S,avail=P.filter(p=>!p.absent),mu=avail.filter(p=>p.mustPlay),op=avail.filter(p=>!p.mustPlay);
  if(mu.length>16)return{ok:0,err:`필참 선수가 ${mu.length}명으로 16명 초과`};
  for(let a=0;a<500;a++){
    const so=sh(op),rem=16-mu.length,sel=[...mu,...so.slice(0,rem)];
    if(sel.length<16)return{ok:0,err:`선수 부족 (현재 ${sel.length}명, 16명 필요)`};
    const s=sh(sel),cts=[];
    for(let c=0;c<4;c++)cts.push({court:c+1,teamA:[s[c*4],s[c*4+1]],teamB:[s[c*4+2],s[c*4+3]]});
    let v=1;
    for(const cf of C){for(const ct of cts){const ids=[...ct.teamA.map(p=>p.id),...ct.teamB.map(p=>p.id)];if(ids.includes(cf.player1)&&ids.includes(cf.player2)){v=0;break}}if(!v)break}
    if(v)return{ok:1,courts:cts,bench:avail.filter(p=>!sel.find(s=>s.id===p.id))}
  }
  return{ok:0,err:'회피 조건을 만족하는 배치를 찾지 못했습니다. 설정을 확인해주세요.'}
}

function calcSug(){
  const rc=S.history.slice(0,5);if(rc.length<2)return[];
  const st={};
  rc.forEach(h=>{h.courts.forEach(ct=>{
    const r=ct.results||{},sa=parseInt(r.scoreA)||0,sb=parseInt(r.scoreB)||0;
    if(!sa&&!sb)return;
    [...ct.teamA,...ct.teamB].forEach(p=>{if(!st[p.id])st[p.id]={name:p.name,w:0,l:0,pd:0,g:0,hc:p.handicap}});
    const d=sa-sb;
    ct.teamA.forEach(p=>{if(st[p.id]){st[p.id].g++;st[p.id].pd+=d;if(d>0)st[p.id].w++;else if(d<0)st[p.id].l++}});
    ct.teamB.forEach(p=>{if(st[p.id]){st[p.id].g++;st[p.id].pd-=d;if(d<0)st[p.id].w++;else if(d>0)st[p.id].l++}});
  })});
  const sg=[];
  Object.entries(st).forEach(([id,s])=>{
    if(s.g<2)return;const wr=s.w/s.g,ad=s.pd/s.g,cur=S.players.find(p=>p.id===id);if(!cur)return;
    if(wr>=.7&&ad>3&&cur.handicap<3)sg.push({id,name:s.name,cur:cur.handicap,sug:Math.min(3,cur.handicap+1),reason:`승률${Math.round(wr*100)}% 평균${ad>0?'+':''}${ad.toFixed(1)}점`,dir:'up'});
    else if(wr<=.3&&ad<-3&&cur.handicap>-3)sg.push({id,name:s.name,cur:cur.handicap,sug:Math.max(-3,cur.handicap-1),reason:`승률${Math.round(wr*100)}% 평균${ad>0?'+':''}${ad.toFixed(1)}점`,dir:'dn'});
  });
  return sg;
}

function expXL(){
  if(!S.history.length){alert('내보낼 히스토리가 없습니다.');return}
  const wb=XLSX.utils.book_new();
  const sd=[];
  sd.push(['○○고등학교 리그전 기록','','','','','','']);
  sd.push([`반: ${S.currentClass}`,'',`내보내기: ${new Date().toLocaleString('ko-KR')}`,'','','','']);
  sd.push([]);
  S.history.forEach((h,i)=>{
    sd.push([`[${i+1}] ${h.sport} 리그전 — ${h.date}`]);
    sd.push(['코트','TEAM A','핸디캡A','TEAM B','핸디캡B','시작A','시작B','최종A','최종B','승리팀']);
    h.courts.forEach(ct=>{
      const sa=ct.results?.scoreA||ct.score?.a||'',sb=ct.results?.scoreB||ct.score?.b||'';
      const ss=ct.startScore||calcStart(ct.teamA,ct.teamB);
      let w='';if(sa&&sb){const a=parseInt(sa),b=parseInt(sb);w=a>b?'TEAM A':a<b?'TEAM B':'무승부'}
      sd.push([`코트${ct.court}`,ct.teamA.map(p=>p.name).join('+'),thc(ct.teamA),ct.teamB.map(p=>p.name).join('+'),thc(ct.teamB),ss.a,ss.b,sa,sb,w]);
    });
    if(h.bench?.length)sd.push(['대기',h.bench.map(p=>p.name).join(', ')]);
    if(h.roles){const re=Object.entries(h.roles).filter(([,v])=>v);const cr=(h.customRoles||[]).filter(r=>r.name&&r.person).map(r=>`${r.name}:${r.person}`);const all=[...re.map(([k,v])=>`${k}:${v}`),...cr];if(all.length)sd.push(['운영',all.join(', ')])}
    sd.push([]);
  });
  const ws1=XLSX.utils.aoa_to_sheet(sd);
  ws1['!cols']=[{wch:8},{wch:22},{wch:8},{wch:22},{wch:8},{wch:6},{wch:6},{wch:8},{wch:8},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws1,'경기기록');

  const ps={};
  S.history.forEach(h=>{h.courts.forEach(ct=>{
    const sa=parseInt(ct.results?.scoreA||ct.score?.a)||0,sb=parseInt(ct.results?.scoreB||ct.score?.b)||0;
    if(!sa&&!sb)return;
    [...ct.teamA.map(p=>({...p,tm:'A'})),...ct.teamB.map(p=>({...p,tm:'B'}))].forEach(p=>{
      if(!ps[p.id])ps[p.id]={name:p.name,hc:p.handicap,g:0,w:0,l:0,d:0,pf:0,pa:0};
      const s=ps[p.id],my=p.tm==='A'?sa:sb,op=p.tm==='A'?sb:sa;
      s.g++;s.pf+=my;s.pa+=op;if(my>op)s.w++;else if(my<op)s.l++;else s.d++;
    });
  })});
  const sd2=[['이름','핸디캡','경기수','승','패','무','득점','실점','득실차','승률']];
  Object.values(ps).sort((a,b)=>(b.w/(b.g||1))-(a.w/(a.g||1))).forEach(p=>{
    sd2.push([p.name,p.hc,p.g,p.w,p.l,p.d,p.pf,p.pa,p.pf-p.pa,p.g?Math.round(p.w/p.g*100)+'%':'-']);
  });
  const ws2=XLSX.utils.aoa_to_sheet(sd2);
  ws2['!cols']=[{wch:12},{wch:8},{wch:8},{wch:6},{wch:6},{wch:6},{wch:8},{wch:8},{wch:8},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws2,'선수통계');
  XLSX.writeFile(wb,`리그전_${S.currentClass}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

        hi.courts.forEach((ct,ci)=>{

          }else{
            h+=`<div style="display:flex;gap:16px;flex-wrap:wrap">
            <div><span style="font-size:11px;font-weight:700;color:#1e40af">TEAM A: </span>${ct.teamA.map(p=>`${E(p.name)}(${ht(p.handicap)})`).join(', ')}</div>
            <div><span style="font-size:11px;font-weight:700;color:#7c3aed">TEAM B: </span>${ct.teamB.map(p=>`${E(p.name)}(${ht(p.handicap)})`).join(', ')}</div></div>`;
          }
          h+=`</div>`;
        });
        if(hi.bench?.length)h+=`<div style="font-size:13px;color:#6b7280;margin-bottom:8px">대기: ${hi.bench.map(p=>E(p.name)).join(', ')}</div>`;
        if(T&&hi.roles){const re=Object.entries(hi.roles).filter(([,v])=>v);const cr=(hi.customRoles||[]).filter(r=>r.name&&r.person).map(r=>`${r.name}(${E(r.person)}`+')');const all=[...re.map(([k,v])=>`${k}(${E(v)})`), ...cr];if(all.length)h+=`<div style="font-size:13px;color:#6b7280">운영: ${all.join(', ')}</div>`}
        h+=`</div>`;
      }
      h+=`</div>`;

  }

  // ═══ DATA MANAGEMENT TAB ═══
  if(s.tab==='data'&&T){
    h+=`<div class="dm-info">💡 데이터를 JSON 파일로 내보내거나, 다른 기기에서 내보낸 파일을 가져올 수 있습니다.<br>USB, 카카오톡, 이메일 등으로 파일을 옮겨서 사용하세요.</div>`;

    // Current class
    h+=`<div class="dm-card">
      <div class="dm-title">📚 현재 반 — ${E(s.currentClass)}</div>
      <div class="dm-desc">선수 ${s.players.length}명 · 회피 ${s.conflicts.length}건 · 히스토리 ${s.history.length}건</div>
      <div class="dm-btns">
        <button class="dm-btn export" onclick="expClass()">📤 이 반 내보내기</button>
        <label class="dm-file-label">📥 이 반 가져오기<input type="file" accept=".json" onchange="impClass(event)" style="display:none"></label>
      </div>
    </div>`;

    // All classes
    const totalP=Object.values(s.classData).reduce((a,d)=>a+(d.players?.length||0),0);
    const totalH=Object.values(s.classData).reduce((a,d)=>a+(d.history?.length||0),0);
    h+=`<div class="dm-card">
      <div class="dm-title">🏫 전체 반 데이터 (${s.classes.length}개 반)</div>
      <div class="dm-desc">${s.classes.map(c=>{const d=s.classData[c]||{};return`${c}: 선수 ${d.players?.length||0}명, 히스토리 ${d.history?.length||0}건`}).join('<br>')}</div>
      <div class="dm-btns">
        <button class="dm-btn export-all" onclick="expAll()">📤 전체 내보내기</button>
        <label class="dm-file-label" style="border-color:#fb923c;background:#fff7ed;color:#ea580c">📥 전체 가져오기<input type="file" accept=".json" onchange="impAll(event)" style="display:none"></label>
      </div>
    </div>`;

    // Danger zone
    h+=`<div class="dm-card" style="border-color:#fca5a5">
      <div class="dm-title" style="color:#dc2626">⚠️ 위험 영역</div>
      <div class="dm-desc">데이터를 삭제하면 복구할 수 없습니다. 내보내기 후 삭제를 권장합니다.</div>
      <div class="dm-btns">
        <button class="dm-btn danger" onclick="resetClass()">🗑 ${E(s.currentClass)} 초기화</button>
        <button class="dm-btn danger" style="border-color:#ef4444;color:#fff;background:#ef4444" onclick="resetAll()">🗑 전체 데이터 초기화</button>
      </div>
    </div>`;
  }

  h+=`</div>`;

  // Floating save/load bar
  h+=`<div class="float-bar">
    <button class="float-btn save" onclick="quickSave()">💾 파일 저장</button>
    <span class="float-sep">|</span>
    <label class="float-btn load">📂 파일 불러오기<input type="file" accept=".json" onchange="quickLoad(event)" style="display:none"></label>
    ${S._lastSaved?`<div class="float-status">마지막 저장: ${S._lastSaved}</div>`:'<div class="float-status">💡 공용PC는 종료 전 파일 저장 필수!</div>'}
  </div>`;
  // Toast container
  h+=`<div id="toast-area"></div>`;

  document.getElementById('app').innerHTML=h;
}

// ═══ Actions ═══
function TM(){S.isTeacher=!S.isTeacher;if(!S.isTeacher&&(S.tab==='conflict'||S.tab==='roster'||S.tab==='data'))S.tab='assign';R()}
function ST(t){S.tab=t;S.editingResultIdx=null;R()}
function SS(v){S.sportType=v;R()}
function CC(c){swCls(c);R()}
function AC(){const n=S.newClassName.trim();if(!n)return;if(S.classes.includes(n)){alert('이미 있는 반입니다.');return}S.classes.push(n);S.showNewClass=false;S.newClassName='';swCls(n);save();R()}
function DC(){if(S.classes.length<=1){alert('최소 1개 반 필요');return}if(!confirm(`"${S.currentClass}" 반의 모든 데이터가 삭제됩니다.`))return;delete S.classData[S.currentClass];S.classes=S.classes.filter(c=>c!==S.currentClass);swCls(S.classes[0]);save();R()}
function RnC(){const n=prompt(`"${S.currentClass}" 반의 새 이름을 입력하세요:`,S.currentClass);if(!n||!n.trim()||n.trim()===S.currentClass)return;const nm=n.trim();if(S.classes.includes(nm)){alert('이미 있는 반 이름입니다.');return;}const idx=S.classes.indexOf(S.currentClass);S.classes[idx]=nm;S.classData[nm]=S.classData[S.currentClass];delete S.classData[S.currentClass];S.currentClass=nm;save();R()}
function AP(){const n=S.newName.trim();if(!n)return;if(S.players.find(p=>p.name===n)){alert('같은 이름 존재');return}S.players.push({id:gid(),name:n,handicap:S.newHandicap,mustPlay:false,absent:false});S.newName='';S.newHandicap=0;save();R()}
function AB(){const ns=S.bulkInput.split(/[\n,]+/).map(n=>n.trim()).filter(Boolean),ex=new Set(S.players.map(p=>p.name)),dp=[],ad=[];ns.forEach(n=>{if(ex.has(n)||ad.includes(n))dp.push(n);else{S.players.push({id:gid(),name:n,handicap:0,mustPlay:false,absent:false});ad.push(n)}});if(dp.length)alert('중복 제외: '+dp.join(', '));S.bulkInput='';S.showBulk=false;save();R()}
function RP(id){S.players=S.players.filter(p=>p.id!==id);S.conflicts=S.conflicts.filter(c=>c.player1!==id&&c.player2!==id);save();R()}
function TMP(id){const p=S.players.find(p=>p.id===id);if(p){p.mustPlay=!p.mustPlay;if(p.mustPlay)p.absent=false}save();R()}
function TAB(id){const p=S.players.find(p=>p.id===id);if(p){p.absent=!p.absent;if(p.absent)p.mustPlay=false}save();R()}
function resetAbsent(){S.players.forEach(p=>p.absent=false);save();R()}
function SEd(id){const p=S.players.find(p=>p.id===id);if(p){S.editingId=id;S.editName=p.name;S.editHandicap=p.handicap}R()}
function SE(){const p=S.players.find(p=>p.id===S.editingId);if(p){p.name=S.editName.trim()||p.name;p.handicap=S.editHandicap}S.editingId=null;save();R()}
function ACf(){if(!S.cp1||!S.cp2||S.cp1===S.cp2)return;if(S.conflicts.find(c=>(c.player1===S.cp1&&c.player2===S.cp2)||(c.player1===S.cp2&&c.player2===S.cp1))){alert('이미 등록됨');return}S.conflicts.push({player1:S.cp1,player2:S.cp2});S.cp1='';S.cp2='';save();R()}
function RCf(i){S.conflicts.splice(i,1);save();R()}
function DA(){S.assignError='';selectedBench='';const r=asgn();if(r.ok){S.assignment=r;S.gameRoles={};S.customRoles=[];S.scores={}}else{S.assignment=null;S.assignError=r.err}R()}
function SSc(c,t,v){if(!S.scores[c])S.scores[c]={};S.scores[c][t]=v}
function SRl(r,v){S.gameRoles[r]=v}
// Drag & drop + click-to-assign (mobile friendly)
let dragData={type:'',name:'',from:''};
let selectedBench='';
function dragBench(e,name){dragData={type:'bench',name};e.dataTransfer.effectAllowed='move'}
function dragFromRole(e,key){dragData={type:'role',name:S.gameRoles[key],from:key};e.dataTransfer.effectAllowed='move'}
function dragFromCustom(e,idx){dragData={type:'custom',name:S.customRoles[idx].person,from:idx};e.dataTransfer.effectAllowed='move'}
function dropRole(e,key){e.preventDefault();e.currentTarget.classList.remove('over');if(!dragData.name)return;
  if(dragData.type==='role'&&dragData.from!==key){const old=S.gameRoles[key];S.gameRoles[key]=dragData.name;S.gameRoles[dragData.from]=old||''}
  else if(dragData.type==='custom'){const old=S.gameRoles[key];S.gameRoles[key]=dragData.name;S.customRoles[dragData.from].person=old||''}
  else{if(S.gameRoles[key]){}S.gameRoles[key]=dragData.name}
  dragData={};R()}
function dropCustom(e,idx){e.preventDefault();e.currentTarget.classList.remove('over');if(!dragData.name)return;
  if(dragData.type==='custom'&&dragData.from!==idx){const old=S.customRoles[idx].person;S.customRoles[idx].person=dragData.name;S.customRoles[dragData.from].person=old||''}
  else if(dragData.type==='role'){const old=S.customRoles[idx].person;S.customRoles[idx].person=dragData.name;S.gameRoles[dragData.from]=old||''}
  else{S.customRoles[idx].person=dragData.name}
  dragData={};R()}
// Click-to-assign for mobile
function tapBench(name){if(selectedBench===name){selectedBench='';R();return}selectedBench=name;R()}
function tapRole(key){if(!selectedBench)return;S.gameRoles[key]=selectedBench;selectedBench='';R()}
function tapCustom(idx){if(!selectedBench)return;S.customRoles[idx].person=selectedBench;selectedBench='';R()}
function clearRole(key){S.gameRoles[key]='';R()}
function clearCustomRole(idx){S.customRoles[idx].person='';R()}
function rmCustomRole(idx){S.customRoles.splice(idx,1);R()}
function addCustomRole(){S.customRoles.push({name:'',person:''});R()}
function SH(){if(!S.assignment)return;const e={id:gid(),date:new Date().toLocaleString('ko-KR'),sport:S.sportType,
  courts:S.assignment.courts.map(c=>{const st=calcStart(c.teamA,c.teamB);return{...c,teamA:c.teamA.map(p=>({...p})),teamB:c.teamB.map(p=>({...p})),
    startScore:{a:st.a,b:st.b},score:S.scores[c.court]||{a:'',b:''},results:{scoreA:S.scores[c.court]?.a||'',scoreB:S.scores[c.court]?.b||''}}}),
  bench:S.assignment.bench?.map(p=>({...p}))||[],roles:{...S.gameRoles},customRoles:S.customRoles.map(r=>({...r}))};
  S.history.unshift(e);save();R();alert('저장되었습니다!')}
function TH(i){S.viewHistoryIdx=S.viewHistoryIdx===i?null:i;S.editingResultIdx=null;R()}
function DH(id){S.history=S.history.filter(h=>h.id!==id);S.viewHistoryIdx=null;save();R()}
function SHR(hi,ci,f,v){if(!S.history[hi].courts[ci].results)S.history[hi].courts[ci].results={};S.history[hi].courts[ci].results[f]=v;if(f==='scoreA'){if(!S.history[hi].courts[ci].score)S.history[hi].courts[ci].score={};S.history[hi].courts[ci].score.a=v}if(f==='scoreB'){if(!S.history[hi].courts[ci].score)S.history[hi].courts[ci].score={};S.history[hi].courts[ci].score.b=v}save()}
function AHC(id,v){const p=S.players.find(p=>p.id===id);if(p){p.handicap=v;save();R();alert(`${p.name} 핸디캡 → ${ht(v)}`)}}

// ═══ Data Import / Export ═══
function expClass(){
  save();
  const data={version:2,type:'class',className:S.currentClass,exportDate:new Date().toLocaleString('ko-KR'),
    data:S.classData[S.currentClass]||{players:[],conflicts:[],history:[]}};
  dlJSON(data,`${S.currentClass}_데이터_${dateStr()}.json`);
}
function expAll(){
  save();
  const data={version:2,type:'all',classes:S.classes,classData:S.classData,exportDate:new Date().toLocaleString('ko-KR')};
  dlJSON(data,`전체반_데이터_${dateStr()}.json`);
}
function dlJSON(obj,filename){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}
function dateStr(){return new Date().toLocaleDateString('ko-KR').replace(/\.\s?/g,'')}

function impClass(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const d=JSON.parse(ev.target.result);
      if(d.type==='class'&&d.data){
        const mode=confirm(`"${d.className||'가져온 반'}" 데이터를 현재 반(${S.currentClass})에 덮어쓰시겠습니까?\n\n[확인] = 현재 반에 덮어쓰기\n[취소] = 새 반으로 추가`);
        if(mode){
          S.classData[S.currentClass]=d.data;
          swCls(S.currentClass);
          save();R();
          alert(`"${S.currentClass}" 반에 데이터를 가져왔습니다.\n선수 ${d.data.players?.length||0}명 · 히스토리 ${d.data.history?.length||0}건`);
        } else {
          let name=d.className||'가져온 반';
          if(S.classes.includes(name)) name=name+'(2)';
          while(S.classes.includes(name)) name=name+'_';
          S.classes.push(name);
          S.classData[name]=d.data;
          swCls(name);save();R();
          alert(`"${name}" 반으로 데이터를 추가했습니다.`);
        }
      } else if(d.type==='all'){
        alert('전체 데이터 파일입니다. "전체 가져오기" 버튼을 사용해주세요.');
      } else { alert('올바른 데이터 파일이 아닙니다.'); }
    }catch(err){alert('파일을 읽을 수 없습니다: '+err.message)}
  };
  reader.readAsText(file);
  e.target.value='';
}

function impAll(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const d=JSON.parse(ev.target.result);
      if(d.type==='all'&&d.classes&&d.classData){
        const mode=confirm(`전체 데이터를 가져옵니다.\n${d.classes.length}개 반: ${d.classes.join(', ')}\n\n[확인] = 기존 데이터에 합치기 (같은 반 이름은 덮어쓰기)\n[취소] = 기존 데이터 전부 삭제 후 교체`);
        if(mode){
          d.classes.forEach(c=>{
            if(!S.classes.includes(c))S.classes.push(c);
            S.classData[c]=d.classData[c];
          });
        } else {
          if(!confirm('정말 기존 데이터를 모두 삭제하고 교체하시겠습니까?'))return;
          S.classes=d.classes;
          S.classData=d.classData;
        }
        swCls(S.classes[0]);save();R();
        alert(`전체 데이터를 가져왔습니다. (${S.classes.length}개 반)`);
      } else if(d.type==='class'){
        alert('단일 반 데이터 파일입니다. "이 반 가져오기" 버튼을 사용해주세요.');
      } else { alert('올바른 데이터 파일이 아닙니다.'); }
    }catch(err){alert('파일을 읽을 수 없습니다: '+err.message)}
  };
  reader.readAsText(file);
  e.target.value='';
}

function resetClass(){
  if(!confirm(`"${S.currentClass}" 반의 모든 선수·회피·히스토리를 삭제하시겠습니까?`))return;
  S.classData[S.currentClass]={players:[],conflicts:[],history:[]};
  swCls(S.currentClass);save();R();
  alert('초기화되었습니다.');
}
function resetAll(){
  if(!confirm('정말 모든 반의 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.'))return;
  if(!confirm('마지막 확인: 전체 데이터가 삭제됩니다. 계속하시겠습니까?'))return;
  S.classes=['1반'];S.classData={'1반':{players:[],conflicts:[],history:[]}};
  swCls('1반');save();R();
  alert('전체 데이터가 초기화되었습니다.');
}

// ═══ Quick Save / Load (floating bar) ═══
let _fileHandle=null;
function showToast(msg){
  const t=document.getElementById('toast-area');
  if(!t)return;
  t.innerHTML=`<div class="save-toast">${msg}</div>`;
  setTimeout(()=>{if(t)t.innerHTML=''},2200);
}

async function quickSave(){
  save(); // save to localStorage first
  const data={version:2,type:'all',classes:S.classes,classData:S.classData,exportDate:new Date().toLocaleString('ko-KR')};

  // Try File System Access API (Chrome 86+, allows overwriting same file)
  if(window.showSaveFilePicker&&_fileHandle){
    try{
      const writable=await _fileHandle.createWritable();
      await writable.write(JSON.stringify(data,null,2));
      await writable.close();
      S._lastSaved=new Date().toLocaleTimeString('ko-KR');
      S._hasUnsaved=false;
      showToast('✅ 파일 저장 완료!');
      R();return;
    }catch(e){/* fall through to picker */}
  }

  if(window.showSaveFilePicker){
    try{
      _fileHandle=await window.showSaveFilePicker({
        suggestedName:`리그전_데이터.json`,
        types:[{description:'JSON',accept:{'application/json':['.json']}}]
      });
      const writable=await _fileHandle.createWritable();
      await writable.write(JSON.stringify(data,null,2));
      await writable.close();
      S._lastSaved=new Date().toLocaleTimeString('ko-KR');
      S._hasUnsaved=false;
      showToast('✅ 파일 저장 완료!');
      R();return;
    }catch(e){if(e.name!=='AbortError')console.error(e)}
  }

  // Fallback: download
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`리그전_데이터.json`;a.click();
  URL.revokeObjectURL(url);
  S._lastSaved=new Date().toLocaleTimeString('ko-KR');
  S._hasUnsaved=false;
  showToast('✅ 파일 다운로드 완료!');
  R();
}

function quickLoad(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const d=JSON.parse(ev.target.result);
      if(d.type==='all'&&d.classes&&d.classData){
        S.classes=d.classes;
        S.classData=d.classData;
        swCls(S.classes[0]);save();
        S._lastSaved=null;S._hasUnsaved=false;
        R();
        showToast(`📂 ${d.classes.length}개 반 데이터를 불러왔습니다`);
      } else if(d.type==='class'&&d.data){
        let name=d.className||'가져온 반';
        if(!S.classes.includes(name)){S.classes.push(name)}
        S.classData[name]=d.data;
        swCls(name);save();
        S._lastSaved=null;S._hasUnsaved=false;
        R();
        showToast(`📂 "${name}" 반 데이터를 불러왔습니다`);
      } else {
        alert('올바른 리그전 데이터 파일이 아닙니다.');
      }
    }catch(err){alert('파일을 읽을 수 없습니다: '+err.message)}
  };
  reader.readAsText(file);
  e.target.value='';
}

// Track unsaved changes  
window.addEventListener('beforeunload',function(e){
  if(S._hasUnsaved){e.preventDefault();e.returnValue=''}
});

load();R();
</script>
